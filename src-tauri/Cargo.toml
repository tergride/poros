[package]
name = "poros"
version = "0.1.0"
description = "Poros, a VPN and proxy client"
license = "GPL-3.0-only"
repository = "https://github.com/tergride/poros"
edition = "2024"
rust-version = "1.99"

[lib]
name = "poros_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["io-util", "macros", "net", "process", "sync", "time"] }
getrandom = "0.3"

[dev-dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
